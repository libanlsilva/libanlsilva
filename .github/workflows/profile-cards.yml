      - name: Check profile generator
        run: node --test tests/*.test.mjs
      - name: Refresh real activity and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs --refresh
      - name: Commit updated profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data scripts tests profile.json package.json .gitignore README.md README.en.md README.es.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile activity'
            git push
          fi
