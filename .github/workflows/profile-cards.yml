name: Refresh profile activity
on:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths: ['scripts/generate.mjs', 'profile.json', '.github/workflows/profile-cards.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh real activity and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs --refresh
      - name: Commit updated profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data/activity.json README.md README.en.md README.es.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile activity'
            git push
          fi
